<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Radar da Reforma Tributária</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #010818; color: #fff; font: 16px/1.5 system-ui, sans-serif; padding: 16px; text-align: center; }
  a { color: #F5B942; }
</style>
</head>
<body>
<p>Envio recebido. <a href="/">Voltar ao Radar da Reforma Tributária</a></p>
<script>
  // Aberta dentro do iframe de envio: avisa a página do Radar que o Web3Forms registrou este envio.
  if (window.parent !== window) {
    var id = new URLSearchParams(location.search).get("id");
    window.parent.postMessage({ radarSent: id }, location.origin);
  }
</script>
</body>
</html>
